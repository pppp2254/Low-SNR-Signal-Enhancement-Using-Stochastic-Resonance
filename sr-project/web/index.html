<title>Double Well Readout</title>
<style>
:root{
  --ground:#e8eae9; --panel:#eff1f0; --ink:#14181a; --muted:#5a6265;
  --rule:#c2c8c6; --rule-soft:#d7dcda; --mark:#b7791f;
  /* Figures are white-backed matplotlib output; give them a fixed ground so
     they look the same in both themes. */
  --fig-bg:#ffffff;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --ground:#14181a; --panel:#1b2022; --ink:#e4e8e6; --muted:#94a09e;
    --rule:#2e3639; --rule-soft:#232a2c; --mark:#d9a441;
  }
}
:root[data-theme="dark"]{
  --ground:#14181a; --panel:#1b2022; --ink:#e4e8e6; --muted:#94a09e;
  --rule:#2e3639; --rule-soft:#232a2c; --mark:#d9a441;
}
*{box-sizing:border-box;border-radius:0}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Times New Roman",Times,serif; font-size:16px; line-height:1.4;
}
.wrap{max-width:1320px;margin:0 auto;padding:28px 24px 64px}
h1{font-size:30px;font-weight:400;margin:0;text-wrap:balance}
.params{color:var(--muted);font-size:14px;margin:6px 0 0;font-style:italic}
.strip{display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:18px}
.stat{padding:12px 16px;border-right:1px solid var(--rule-soft)}
.stat:nth-child(4n){border-right:0}
.stat:nth-child(-n+4){border-bottom:1px solid var(--rule-soft)}
.stat .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v em{font-style:italic;font-size:15px;color:var(--muted)}
h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:400;
   color:var(--muted);margin:32px 0 8px;border-bottom:1px solid var(--rule);padding-bottom:5px}
figure{margin:0 0 26px}
figure img{display:block;width:100%;height:auto;background:var(--fig-bg);padding:8px}
figcaption{font-size:13px;color:var(--muted);margin-top:5px;font-style:italic}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:3px 8px;border-bottom:1px solid var(--rule-soft)}
th{font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
   color:var(--muted);border-bottom:1px solid var(--rule)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td:last-child{color:var(--muted)}
.scroll{overflow-x:auto}
#controls{display:none;margin-top:18px;padding:12px 0;border-bottom:1px solid var(--rule)}
#controls.live{display:block}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font-family:inherit;font-size:14px;color:var(--ink);background:var(--panel);
  border:1px solid var(--rule);padding:5px 12px;cursor:pointer}
button:disabled{color:var(--muted);cursor:default}
button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
#runlog{white-space:pre-wrap;font-size:12px;color:var(--muted);margin-top:8px;
  max-height:150px;overflow:auto}
#runstate{font-size:13px;color:var(--muted);margin-left:6px}
tr.peak td{color:var(--mark)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
@media (max-width:900px){.strip{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2n){border-right:0}.cols{grid-template-columns:1fr}}
</style>
<div class="wrap">
  <h1>Stochastic resonance in a bistable double well</h1>
  <p class="params" id="params"></p>
  <div class="strip" id="strip"></div>
  <div id="controls">
    <div class="btns" id="runbtns"></div>
    <div id="runlog"></div>
  </div>
  <div id="figures"></div>
  <div class="cols">
    <section><h2>Measured values</h2><div class="scroll"><table id="summary"></table></div></section>
    <section><h2>E3 &nbsp; SNR against D</h2><div class="scroll"><table id="e3table"></table></div></section>
  </div>
</div>
<script src="data.js"></script>
<script>
const D = window.__DATA__, M = D.meta;

document.getElementById("params").textContent =
  `a = ${M.a}, b = ${M.b}, A = ${M.A} (A_c = ${M.Ac}), f0 = ${M.f0}, dt = ${M.dt}, ` +
  `fs = ${M.fs}, ${M.nPeriods} periods recorded, ${M.discard} discarded, ` +
  `barrier = ${M.barrier}`;

document.getElementById("strip").innerHTML = D.stats.map(
  ([k, v, unit]) => `<div class="stat"><div class="k">${k}</div>` +
    `<div class="v">${v}${unit ? ` <em>${unit}</em>` : ""}</div></div>`).join("");

document.getElementById("figures").innerHTML = D.figures.map(f =>
  `<figure><h2>${f.id} &nbsp; ${f.title}</h2>` +
  `<img src="${f.file}" alt="${f.id}: ${f.title}" loading="lazy">` +
  `</figure>`).join("");

// Rerun controls. They need the Elysia server, so they stay hidden when the
// page is served as a static artifact and /run/status is unreachable.
const RUNS = [["e1", "E1"], ["e2", "E2"], ["e3", "E3"], ["e4", "E4"], ["e5", "E5"],
              ["data", "Refresh numbers"]];
const controls = document.getElementById("controls");
const btns = document.getElementById("runbtns");
const runlog = document.getElementById("runlog");
let polling = null;

function setBusy(busy) {
  btns.querySelectorAll("button").forEach(b => { b.disabled = busy; });
}

function renderStatus(s) {
  const st = document.getElementById("runstate");
  if (!s.job) { st.textContent = "idle"; return; }
  const j = s.job;
  st.textContent = j.done
    ? `${j.name} finished in ${j.seconds}s${j.code === 0 ? "" : ` (exit ${j.code})`}`
    : `${j.name} running, ${j.seconds}s`;
  runlog.textContent = j.log || "";
  runlog.scrollTop = runlog.scrollHeight;
}

async function poll() {
  const s = await (await fetch("/run/status")).json();
  renderStatus(s);
  setBusy(s.running);
  if (!s.running && polling) {
    clearInterval(polling);
    polling = null;
    // Figures are served no-store, so a reload picks up the new PNGs.
    location.reload();
  }
}

async function trigger(name) {
  setBusy(true);
  const res = await fetch(`/run/${name}`, { method: "POST" });
  if (!res.ok) {
    runlog.textContent = (await res.json()).error || "failed to start";
    setBusy(false);
    return;
  }
  runlog.textContent = "";
  if (!polling) polling = setInterval(poll, 1500);
  poll();
}

fetch("/run/status").then(r => {
  if (!r.ok) throw new Error("no run server");
  return r.json();
}).then(s => {
  controls.classList.add("live");
  btns.innerHTML = RUNS.filter(([k]) => s.experiments.includes(k))
    .map(([k, label]) => `<button data-run="${k}">${k === "data" ? label : "Rerun " + label}</button>`).join("") +
    '<span id="runstate">idle</span>';
  btns.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => trigger(b.dataset.run)));
  renderStatus(s);
  if (s.running) { polling = setInterval(poll, 1500); }
}).catch(() => { /* static artifact, no server: controls stay hidden */ });

const st = document.getElementById("summary");
st.innerHTML = "<thead><tr><th>Run</th><th>Quantity</th><th>Value</th><th>Note</th></tr></thead>";
let tb = document.createElement("tbody");
D.summary.forEach(([run, q, v, note]) => {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${run}</td><td>${q}</td><td>${v}</td><td>${note || ""}</td>`;
  tb.appendChild(tr);
});
st.appendChild(tb);

if (D.e3) {
  const t = document.getElementById("e3table");
  t.innerHTML = "<thead><tr><th>D</th><th>SNR (dB)</th><th>16%</th><th>84%</th>" +
                "<th>theory (dB)</th></tr></thead>";
  tb = document.createElement("tbody");
  D.e3.D.forEach((d, i) => {
    const tr = document.createElement("tr");
    if (i === D.e3.peak) tr.className = "peak";
    tr.innerHTML = `<td>${d.toFixed(4)}</td><td>${D.e3.snr[i].toFixed(2)}</td>` +
      `<td>${D.e3.lo[i].toFixed(2)}</td><td>${D.e3.hi[i].toFixed(2)}</td>` +
      `<td>${D.e3.theory[i].toFixed(2)}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb);
}
</script>
